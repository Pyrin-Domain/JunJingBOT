<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0d1317" />
  <title>君景 Bot 参数面板</title>
  <!-- 相对路径：由后端托管（/）和 python -m http.server（frontend/）都能直接打开 -->
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <a class="skip-link" href="#panels">跳到配置内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">君</span>
        <div class="brand-text">
          <h1>Bot 参数面板</h1>
          <div class="sub" id="configPath">正在连接配置服务…</div>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="state" id="stateBadge" role="status" aria-live="polite">未修改</span>
        <button class="btn ghost" id="btnReload" type="button">加载配置</button>
        <button class="btn primary" id="btnSave" type="button">保存并热加载</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>

  <div class="layout">
    <aside class="sidebar" aria-label="参数面板导航">
      <nav class="tabs" id="tabs" aria-label="配置分类"></nav>
    </aside>
    <main id="panels" tabindex="-1"></main>
  </div>

  <footer class="foot">
    <div class="foot-inner">
      <details>
        <summary>保存与生效说明</summary>
        <div class="foot-copy">
          参数写入 <code>config/bot_config.json</code>。保存后，关键词、搬运和文案会在下一条消息生效；
          外部修改过配置文件时，可使用顶部“加载配置”重新读取。
          <code>web_panel.*</code> 与“连接方式”（<code>config/config.json</code>）仍需重启 Bot；
          <code>agent.*</code> 保存后会热重建。
        </div>
      </details>
      <span class="foot-mark">本地配置工作台</span>
    </div>
  </footer>

  <noscript>这个面板需要启用 JavaScript。</noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
