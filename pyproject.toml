[project]
name = "junjing-bot"
version = "0.1.0"
description = "君景 BOT：NapCat / OneBot QQ 机器人（模块化重写版）"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15.0",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langgraph>=1.0",
    "langchain>=1.0",
    "jieba>=0.42",
    "Pillow>=10.0",
    "aiohttp>=3.9",
    "requests>=2.32",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
